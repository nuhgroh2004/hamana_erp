<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form Builder — ERP Karoseri</title>
<style>
:root{--bg:#f9fafb;--side:#fff;--ink:#212529;--mut:#6c757d;--line:#d8dadd;--acc:#714b67;--accbg:#f1e8ef;--teal:#017e84;--ok:#e3f1e6;--okt:#1e6b34;--warn:#fff1d6;--warnt:#8a5a00;--bad:#fbe3e3;--badt:#a12a2a;--info:#dff0f2;--infot:#0b5f64;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d21;--side:#262a30;--ink:#e9ecef;--mut:#9aa1a9;--line:#3a3f46;--accbg:#3a2a36;--acc:#b78aab;--ok:#1f3a27;--okt:#8fd1a1;--warn:#43361a;--warnt:#f0c36a;--bad:#442525;--badt:#f0a0a0;--info:#1c3a3d;--infot:#8fd0d4}}
:root[data-theme="dark"]{--bg:#1b1d21;--side:#262a30;--ink:#e9ecef;--mut:#9aa1a9;--line:#3a3f46;--accbg:#3a2a36;--acc:#b78aab;--ok:#1f3a27;--okt:#8fd1a1;--warn:#43361a;--warnt:#f0c36a;--bad:#442525;--badt:#f0a0a0;--info:#1c3a3d;--infot:#8fd0d4}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Roboto,"Segoe UI",Helvetica,Arial,sans-serif;display:flex}
aside{width:250px;flex:none;height:100%;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:12px 16px;background:#714b67;color:#fff;display:flex;gap:10px;align-items:center}
.logo{width:30px;height:30px;background:#fff;color:#714b67;display:grid;place-items:center;font-weight:700;border-radius:50%}
.brand b{font-weight:500;font-size:16px;display:block}.brand small{color:#e6d5e1;font-size:11px}
nav{flex:1;overflow-y:auto;padding:6px 0}
.gt{padding:10px 16px 4px;color:var(--acc);font-weight:500;font-size:13px}
nav a{display:flex;justify-content:space-between;padding:6px 16px 6px 22px;color:var(--mut);cursor:pointer;border-left:3px solid transparent}
nav a:hover{color:var(--ink);background:rgba(0,0,0,.04)}
nav a.on{color:var(--acc);background:var(--accbg);border-left-color:var(--acc);font-weight:600}
nav a span{background:var(--acc);color:#fff;font-size:11px;padding:0 6px}
.foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
button,select,input,textarea{font:inherit;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--side);padding:5px 12px;cursor:pointer}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{opacity:.9;color:#fff}
.btn.d:hover{border-color:#c0392b;color:#c0392b}.btn.s{padding:1px 8px;font-size:12px}
main{flex:1;min-width:0;overflow:auto;padding:24px 28px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.crumb{color:var(--mut);font-size:12px}h1{font-weight:500;font-size:24px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:8px 18px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}.tabs a.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.card{background:var(--side);border:1px solid var(--line);border-top:3px solid var(--teal);padding:16px;margin-bottom:16px}
.card h3{font-size:14px;font-weight:500;margin-bottom:10px;color:var(--acc)}
.tw{overflow-x:auto;background:var(--side);border:1px solid var(--line);margin-bottom:16px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:var(--bg);text-align:left;font-weight:500;color:var(--mut);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.c{cursor:pointer}tr.c:hover td{background:var(--accbg)}
.tag{display:inline-block;padding:0 7px;font-size:12px;white-space:nowrap}
.g{background:var(--ok);color:var(--okt)}.y{background:var(--warn);color:var(--warnt)}.r{background:var(--bad);color:var(--badt)}.b{background:var(--info);color:var(--infot)}.n{background:var(--accbg);color:var(--acc)}
.pg{height:6px;background:var(--line)}.pg i{display:block;height:100%;background:var(--teal)}
.fr{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:13px}.fr em{width:150px;font-style:normal;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fr .pg{flex:1;height:12px}.fr b{width:30px;text-align:right;font-weight:500}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;padding:0}
.sw i{width:38px;height:20px;background:var(--line);position:relative;display:inline-block}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff}
.sw.on i{background:var(--teal)}.sw.on i:after{left:20px}
.in{width:100%;padding:7px 9px;border:1px solid var(--line);background:var(--side);outline:none}
.in:focus{border-color:var(--acc)}textarea.in{min-height:70px;resize:vertical}
.lb{display:block;color:var(--mut);font-size:12px;margin:10px 0 3px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.add span{color:var(--mut);margin-right:4px}
.fc{background:var(--side);border:1px solid var(--line);border-left:3px solid var(--line);padding:14px 16px;margin-bottom:10px;cursor:pointer}
.fc:hover{border-color:var(--teal)}.fc.sel{border-left-color:var(--acc);border-color:var(--acc);cursor:default}
.fc .hd{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.fc .fk{pointer-events:none;color:var(--mut)}
.fk .ph{border:1px dashed var(--line);padding:5px 9px;margin-top:4px;font-size:13px}
.tb{display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.pvw{background:var(--accbg);padding:24px 12px}
.fm{max-width:660px;margin:0 auto;background:var(--side);border:1px solid var(--line);border-top:8px solid var(--acc);padding:22px 24px}
.fm h2{font-weight:500;font-size:24px;margin-bottom:4px}.fm>p{color:var(--mut);margin-bottom:12px}
.q{margin-top:18px}.q label{font-weight:500;display:block}.q label i{color:#c0392b;font-style:normal}.q small{color:var(--mut);display:block}
.q .in{margin-top:6px}.q .o{display:flex;gap:8px;align-items:center;margin-top:5px}
.er{color:#c0392b;font-size:12px;min-height:0}
.fm .btn{margin-top:22px}
.ban{background:var(--warn);color:var(--warnt);padding:7px 12px;max-width:660px;margin:0 auto 10px;font-size:13px}
.lk{display:flex;gap:8px}.lk .in{flex:1}
.ov{position:fixed;inset:0;background:var(--bg);display:none;z-index:20;overflow:auto;flex-direction:column}.ov.on{display:flex}
.ob{background:#714b67;color:#fff;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.ob button{background:none;border:1px solid #fff;color:#fff;padding:2px 10px;cursor:pointer}
.toast{position:fixed;bottom:20px;right:20px;background:#212529;color:#fff;padding:9px 16px;display:none;z-index:30}
#mb{display:none;margin-bottom:12px}
@media(max-width:800px){aside{position:fixed;z-index:10;left:-260px;transition:left .15s}aside.show{left:0}#mb{display:inline-block}main{padding:16px}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">K</div><div><b>Form Builder</b><small>Formulir Data · Karoseri ERP</small></div></div>
  <nav id="nav"></nav>
  <div class="foot"><span>Admin</span><button class="btn" id="th">Tema</button></div>
</aside>
<main><button class="btn" id="mb">☰ Menu</button><div id="view"></div></main>
<div class="ov" id="pub"></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TY={text:'Teks Pendek',long:'Paragraf',num:'Angka',date:'Tanggal',enum:'Dropdown (Enum)',radio:'Pilihan Tunggal',check:'Kotak Centang',file:'Upload File (PDF / JPG)'};
const BASE='https://erp.karoseri.co.id/f/';
const uid=()=>Math.random().toString(36).slice(2,8);
const q=(id,t,l,req,x={})=>({id,t,l,req,h:'',o:['Opsi 1','Opsi 2'],ft:['pdf','jpg'],mb:5,...x});
let FM=[
{id:'f1',slug:'lamaran-kerja-x7k2',title:'Formulir Lamaran Kerja',desc:'Isi data diri Anda dengan lengkap dan benar.',active:true,msg:'Terima kasih, lamaran Anda sudah kami terima.',limit:0,close:'',upd:'05 Okt 2026',
fields:[q('a1','text','Nama Lengkap',1),q('a2','date','Tanggal Lahir',1),q('a3','enum','Posisi yang Dilamar',1,{o:['Welder 6G','Fabricator / Fitter','Operator CNC Plasma','Painter / Spray','Engineer Desain']}),q('a4','radio','Pendidikan Terakhir',1,{o:['SMA / SMK','D3','S1']}),q('a5','check','Sertifikat yang Dimiliki',0,{o:['Welder 6G (BNSP)','K3 Umum','SIO Crane','SIO Forklift']}),q('a6','num','Pengalaman Kerja (tahun)',0),q('a7','file','Unggah CV',1,{ft:['pdf'],mb:5,h:'Format PDF, maksimal 5 MB'}),q('a8','file','Pas Foto',0,{ft:['jpg'],mb:2,h:'Format JPG, maksimal 2 MB'})],
resp:[{at:'08 Okt 2026 09:14',v:{a1:'Rizky Pratama',a2:'1999-04-12',a3:'Welder 6G',a4:'SMA / SMK',a5:['Welder 6G (BNSP)','K3 Umum'],a6:'5',a7:'CV_Rizky.pdf',a8:'foto_rizky.jpg'}},{at:'07 Okt 2026 15:40',v:{a1:'Dimas Saputra',a2:'1997-08-30',a3:'Welder 6G',a4:'SMA / SMK',a5:['Welder 6G (BNSP)'],a6:'7',a7:'CV_Dimas.pdf',a8:''}},{at:'06 Okt 2026 11:02',v:{a1:'Nanda Putri',a2:'1999-01-20',a3:'Engineer Desain',a4:'S1',a5:[],a6:'3',a7:'CV_Nanda.pdf',a8:'nanda.jpg'}}]},
{id:'f2',slug:'inspeksi-unit-p9m4',title:'Laporan Inspeksi Unit Car Carrier',desc:'Diisi inspektur QC pada setiap tahap produksi.',active:true,msg:'Laporan inspeksi tersimpan.',limit:0,close:'',upd:'01 Okt 2026',
fields:[q('b1','text','Nomor Rangka (VIN)',1),q('b2','date','Tanggal Inspeksi',1),q('b3','enum','Tahap Produksi',1,{o:['Potong & Bending','Pengelasan','Perakitan Deck','Pengecatan','Final Inspection']}),q('b4','radio','Hasil Inspeksi',1,{o:['Lulus','Lulus Bersyarat','Gagal']}),q('b5','long','Catatan Temuan',0),q('b6','file','Foto / Laporan Temuan',0,{mb:5,h:'PDF atau JPG, maksimal 5 MB'})],
resp:[{at:'08 Okt 2026 08:20',v:{b1:'MHKF1234AB567890',b2:'2026-10-08',b3:'Pengelasan',b4:'Lulus Bersyarat',b5:'Las sambungan ramp perlu diulang.',b6:'temuan_las.jpg'}},{at:'07 Okt 2026 16:05',v:{b1:'MHKF1234AB567891',b2:'2026-10-07',b3:'Final Inspection',b4:'Lulus',b5:'',b6:''}}]},
{id:'f3',slug:'cuti-karyawan-c3q8',title:'Permintaan Cuti Karyawan',desc:'Ajukan cuti minimal 3 hari sebelumnya.',active:false,msg:'Pengajuan cuti terkirim.',limit:0,close:'',upd:'20 Sep 2026',
fields:[q('c1','text','Nama Karyawan',1),q('c2','date','Tanggal Mulai',1),q('c3','date','Tanggal Selesai',1),q('c4','enum','Jenis Cuti',1,{o:['Tahunan','Sakit','Melahirkan','Khusus']}),q('c5','file','Surat Dokter',0,{ft:['pdf','jpg'],mb:3})],resp:[]}];
let cur=null,tab='edit',sel=null,view='list';
const F=()=>FM.find(f=>f.id==cur);
const tag=(t,c)=>`<span class="tag ${c}">${t}</span>`;
const sw=(on,fn)=>`<button class="sw ${on?'on':''}" onclick="${fn}"><i></i>${on?'Aktif':'Nonaktif'}</button>`;
const hdr=(c,t,b='')=>`<div class="top"><div><div class="crumb">Form Builder / ${c}</div><h1>${t}</h1></div><div>${b}</div></div>`;
const isOpen=f=>f.active&&!(f.close&&new Date(f.close)<new Date('2026-10-08'))&&!(f.limit&&f.resp.length>=f.limit);
const state=f=>!f.active?tag('Nonaktif','r'):(isOpen(f)?tag('Aktif','g'):tag('Ditutup','y'));
function ctrl(x,p){const id=`${p}_${x.id}`;
if(x.t=='text')return `<input class="in" id="${id}">`;
if(x.t=='long')return `<textarea class="in" id="${id}"></textarea>`;
if(x.t=='num')return `<input class="in" type="number" id="${id}">`;
if(x.t=='date')return `<input class="in" type="date" id="${id}" style="max-width:220px">`;
if(x.t=='enum')return `<select class="in" id="${id}"><option value="">Pilih…</option>${x.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
if(x.t=='radio')return x.o.map(o=>`<div class="o"><input type="radio" name="${id}" value="${esc(o)}"> ${esc(o)}</div>`).join('');
if(x.t=='check')return x.o.map(o=>`<div class="o"><input type="checkbox" name="${id}" value="${esc(o)}"> ${esc(o)}</div>`).join('');
return `<input class="in" type="file" id="${id}" accept="${x.ft.map(t=>t=='pdf'?'.pdf':'.jpg,.jpeg').join(',')}"><small>${x.ft.map(t=>t.toUpperCase()).join(' / ')} · maks ${x.mb} MB</small>`}
function rform(f,p){return `<div class="fm"><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p>${f.fields.map(x=>`<div class="q"><label>${esc(x.l)} ${x.req?'<i>*</i>':''}</label>${x.h?`<small>${esc(x.h)}</small>`:''}${ctrl(x,p)}<div class="er" id="${p}e_${x.id}"></div></div>`).join('')}<button class="btn p" onclick="sub('${f.id}','${p}')">Kirim</button></div>`}
function sub(fid,p){const f=FM.find(x=>x.id==fid);if(p=='pb'&&!isOpen(f))return toast('Form sudah tidak menerima respons');let ok=true,v={};
f.fields.forEach(x=>{const id=`${p}_${x.id}`,er=$(`#${p}e_${x.id}`);let val='',m='';
if(x.t=='radio')val=(document.querySelector(`input[name="${id}"]:checked`)||{}).value||'';
else if(x.t=='check')val=[...document.querySelectorAll(`input[name="${id}"]:checked`)].map(e=>e.value);
else if(x.t=='file'){const fl=$('#'+id).files[0];if(fl){const ext=fl.name.split('.').pop().toLowerCase(),a=x.ft.flatMap(t=>t=='pdf'?['pdf']:['jpg','jpeg']);if(!a.includes(ext))m='Tipe file harus '+x.ft.join(' / ').toUpperCase();else if(fl.size>x.mb*1048576)m='Ukuran maksimal '+x.mb+' MB';else val=fl.name}}
else{val=$('#'+id).value.trim();if(val&&x.t=='num'&&isNaN(+val))m='Harus berupa angka'}
if(!m&&x.req&&(Array.isArray(val)?!val.length:!val))m='Wajib diisi';
er.textContent=m;if(m)ok=false;v[x.id]=val});
if(!ok)return toast('Periksa isian yang ditandai');
if(p=='pb')f.resp.unshift({at:'08 Okt 2026 '+new Date().toTimeString().slice(0,5),v});
const box=p=='pb'?$('#pub .pvw'):$('#pvbox');box.innerHTML=`<div class="fm"><h2>${esc(f.title)}</h2><p>${esc(f.msg)}</p>${p=='pv'?'<div class="ban" style="margin:0">Pratinjau: respons ini tidak disimpan.</div>':''}<button class="btn" onclick="${p=='pb'?'pubOpen()':'go(\'ed\')'}">Kirim respons lain</button></div>`}
const V={
list(){return hdr('Daftar Form','Daftar Form','<button class="btn p" onclick="nf()">+ Form Baru</button>')+`<div class="tw"><table><tr><th>Judul</th><th>Status</th><th>Tautan</th><th>Pertanyaan</th><th>Respons</th><th>Diubah</th><th>Aksi</th></tr>${FM.map(f=>`<tr><td><a class="c" style="cursor:pointer;color:var(--acc)" onclick="op('${f.id}','edit')"><b>${esc(f.title)}</b></a></td><td>${sw(f.active,`tg('${f.id}')`)}<br>${state(f)}</td><td><small style="color:var(--mut)">/f/${f.slug}</small><br><button class="btn s" onclick="cp('${f.id}')">Salin</button></td><td>${f.fields.length}</td><td><a style="cursor:pointer;color:var(--acc)" onclick="op('${f.id}','resp')">${f.resp.length}</a></td><td>${f.upd}</td><td><button class="btn s" onclick="op('${f.id}','edit')">Edit</button> <button class="btn s" onclick="op('${f.id}','prev')">Preview</button> <button class="btn s" onclick="dup('${f.id}')">Duplikat</button> <button class="btn s d" onclick="del('${f.id}')">Hapus</button></td></tr>`).join('')}</table></div>`},
ed(){const f=F();if(!f)return V.list();const T=[['edit','Edit'],['prev','Preview'],['resp','Respons ('+f.resp.length+')'],['share','Bagikan']];
return hdr('Editor',esc(f.title),state(f)+' &nbsp; '+sw(f.active,`tg('${f.id}')`))+`<div class="tabs">${T.map(t=>`<a class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';go('ed')">${t[1]}</a>`).join('')}</div>`+V['t_'+tab](f)},
t_edit(f){return `<div class="card"><h3>Informasi Form</h3><label class="lb" style="margin-top:0">Judul form</label><input class="in" value="${esc(f.title)}" oninput="F().title=this.value;F().upd='08 Okt 2026'"><label class="lb">Deskripsi</label><textarea class="in" oninput="F().desc=this.value">${esc(f.desc)}</textarea></div>
<div class="add"><span>Tambah pertanyaan:</span>${Object.entries(TY).map(([k,v])=>`<button class="btn s" onclick="af('${k}')">+ ${v}</button>`).join('')}</div>`+
f.fields.map((x,i)=>x.id==sel?fedit(x,i,f):`<div class="fc" onclick="pk('${x.id}')"><div class="hd"><b>${esc(x.l)||'<i>(tanpa judul)</i>'} ${x.req?'<span style="color:#c0392b">*</span>':''}</b>${tag(TY[x.t],'n')}</div><div class="fk">${fprev(x)}</div></div>`).join('')+(f.fields.length?'':'<div class="card">Belum ada pertanyaan. Tambahkan dari tombol di atas.</div>')},
t_prev(f){return `<div class="ban">Mode pratinjau — tampilan seperti yang dilihat pengisi. ${f.active?'':'Form saat ini <b>nonaktif</b>.'}</div><div class="pvw" id="pvbox">${rform(f,'pv')}</div>`},
t_resp(f){const R=f.resp;const sm=f.fields.filter(x=>x.t=='enum'||x.t=='radio').slice(0,2);
return `<div class="top" style="margin-bottom:10px"><b>${R.length} respons</b><div><button class="btn" onclick="toast('Respons diekspor ke CSV')">Ekspor CSV</button> <button class="btn d" onclick="clr()">Hapus Semua</button></div></div>`+(sm.length&&R.length?`<div class="card"><h3>Ringkasan</h3>${sm.map(x=>`<b>${esc(x.l)}</b>${x.o.map(o=>{const n=R.filter(r=>r.v[x.id]==o).length;return `<div class="fr"><em>${esc(o)}</em><div class="pg"><i style="width:${n/R.length*100}%"></i></div><b>${n}</b></div>`}).join('')}<br>`).join('')}</div>`:'')+
(R.length?`<div class="tw"><table><tr><th>Waktu</th>${f.fields.map(x=>`<th>${esc(x.l)}</th>`).join('')}<th></th></tr>${R.map((r,i)=>`<tr><td style="white-space:nowrap">${r.at}</td>${f.fields.map(x=>{const v=r.v[x.id];return `<td>${x.t=='file'?(v?tag('📎 '+esc(v),'b'):'—'):Array.isArray(v)?(v.map(esc).join(', ')||'—'):esc(v)||'—'}</td>`}).join('')}<td><button class="btn s d" onclick="rd(${i})">×</button></td></tr>`).join('')}</table></div>`:'<div class="card">Belum ada respons.</div>')},
t_share(f){const u=BASE+f.slug;return `<div class="grid"><div class="card"><h3>Status Form</h3><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">${sw(f.active,`tg('${f.id}')`)}<span style="color:var(--mut)">${f.active?'Form menerima respons.':'Pengunjung melihat pesan “Form tidak menerima respons”.'}</span></div></div>
<div class="card"><h3>Tautan Publik</h3><div class="lk"><input class="in" id="lnk" readonly value="${u}"><button class="btn p" onclick="cp('${f.id}')">Salin</button><button class="btn" onclick="pubOpen()">Buka Halaman Publik</button></div><label class="lb">Kode sematan (embed)</label><textarea class="in" readonly style="min-height:56px">&lt;iframe src="${u}" width="100%" height="700" frameborder="0"&gt;&lt;/iframe&gt;</textarea><div style="margin-top:10px"><button class="btn s" onclick="rg()">Buat tautan baru</button> <small style="color:var(--mut)">Tautan lama otomatis tidak berlaku.</small></div></div>
<div class="card"><h3>Pengaturan Pengiriman</h3><div class="row"><div><label class="lb" style="margin-top:0">Batas jumlah respons (0 = tanpa batas)</label><input class="in" type="number" min="0" value="${f.limit}" oninput="F().limit=+this.value"></div><div><label class="lb" style="margin-top:0">Tutup otomatis pada tanggal</label><input class="in" type="date" value="${f.close}" oninput="F().close=this.value"></div></div><label class="lb">Pesan setelah form dikirim</label><textarea class="in" oninput="F().msg=this.value">${esc(f.msg)}</textarea></div></div>`}
};
function fprev(x){if(x.t=='text')return '<div class="ph">Jawaban singkat</div>';if(x.t=='long')return '<div class="ph" style="height:46px">Jawaban panjang</div>';if(x.t=='num')return '<div class="ph">Angka</div>';if(x.t=='date')return '<div class="ph" style="max-width:180px">dd/mm/yyyy</div>';
if(x.t=='enum')return `<div class="ph">Pilih… ▾ (${x.o.length} opsi)</div>`;if(x.t=='radio')return x.o.map(o=>`<div>○ ${esc(o)}</div>`).join('');if(x.t=='check')return x.o.map(o=>`<div>☐ ${esc(o)}</div>`).join('');
return `<div class="ph">📎 Pilih file · ${x.ft.map(t=>t.toUpperCase()).join(' / ')} · maks ${x.mb} MB</div>`}
function fedit(x,i,f){const ty=['enum','radio','check'].includes(x.t);return `<div class="fc sel"><div class="row"><div style="flex:2"><label class="lb" style="margin-top:0">Pertanyaan</label><input class="in" value="${esc(x.l)}" oninput="uq('${x.id}','l',this.value)"></div><div><label class="lb" style="margin-top:0">Tipe</label><select class="in" onchange="uq('${x.id}','t',this.value,1)">${Object.entries(TY).map(([k,v])=>`<option value="${k}" ${k==x.t?'selected':''}>${v}</option>`).join('')}</select></div></div>
<label class="lb">Teks bantuan (opsional)</label><input class="in" value="${esc(x.h)}" oninput="uq('${x.id}','h',this.value)">
${ty?`<label class="lb">Opsi pilihan (satu per baris)</label><textarea class="in" oninput="uq('${x.id}','o',this.value.split('\\n').map(s=>s.trim()).filter(Boolean))">${esc(x.o.join('\n'))}</textarea>`:''}
${x.t=='file'?`<div class="row"><div><label class="lb">Tipe file yang diizinkan</label><label><input type="checkbox" ${x.ft.includes('pdf')?'checked':''} onchange="uf('${x.id}','pdf',this.checked)"> PDF</label> &nbsp; <label><input type="checkbox" ${x.ft.includes('jpg')?'checked':''} onchange="uf('${x.id}','jpg',this.checked)"> JPG</label></div><div><label class="lb">Ukuran maksimal (MB)</label><input class="in" type="number" min="1" max="25" value="${x.mb}" oninput="uq('${x.id}','mb',+this.value||1)"></div></div>`:''}
<div class="tb"><label style="flex:1"><input type="checkbox" ${x.req?'checked':''} onchange="uq('${x.id}','req',this.checked?1:0)"> Wajib diisi</label><button class="btn s" onclick="mvq(${i},-1)">↑</button><button class="btn s" onclick="mvq(${i},1)">↓</button><button class="btn s" onclick="dq(${i})">Duplikat</button><button class="btn s d" onclick="rq(${i})">Hapus</button><button class="btn s p" onclick="sel=null;go('ed')">Selesai</button></div></div>`}
const M=[['Formulir',[['list','Daftar Form'],['edit','Editor Form'],['prev','Preview'],['resp','Respons'],['share','Bagikan & Status']]]];
function nav(){$('#nav').innerHTML=M.map(g=>`<div class="gt">${g[0]}</div>`+g[1].map(i=>{const on=i[0]=='list'?view=='list':(view=='ed'&&tab==i[0]);return `<a class="${on?'on':''}" onclick="nv('${i[0]}')">${i[1]}${i[0]=='list'?`<span>${FM.length}</span>`:''}</a>`}).join('')).join('')}
function nv(k){if(k=='list'){view='list';return go('list')}if(!cur)cur=FM[0].id;tab=k;go('ed')}
function go(v){if(v=='ed'||v=='list')view=v;$('#view').innerHTML=V[view]();nav();$('#side').classList.remove('show')}
function op(id,t){cur=id;tab=t;sel=null;go('ed')}
function pk(id){sel=id;go('ed')}
function uq(id,k,v,r){const x=F().fields.find(y=>y.id==id);x[k]=v;F().upd='08 Okt 2026';if(r)go('ed')}
function uf(id,t,on){const x=F().fields.find(y=>y.id==id);x.ft=on?[...new Set([...x.ft,t])]:x.ft.filter(z=>z!=t);if(!x.ft.length){x.ft=[t];go('ed');toast('Pilih minimal satu tipe file')}}
function af(t){const x=q(uid(),t,'Pertanyaan baru',0);F().fields.push(x);sel=x.id;go('ed')}
function mvq(i,d){const a=F().fields,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];go('ed')}
function dq(i){const a=F().fields,x={...a[i],id:uid(),o:[...a[i].o],ft:[...a[i].ft]};a.splice(i+1,0,x);sel=x.id;go('ed')}
function rq(i){F().fields.splice(i,1);sel=null;go('ed')}
function nf(){const f={id:uid(),slug:'form-baru-'+uid(),title:'Form Tanpa Judul',desc:'',active:false,msg:'Terima kasih, respons Anda sudah tersimpan.',limit:0,close:'',upd:'08 Okt 2026',fields:[q(uid(),'text','Pertanyaan 1',0)],resp:[]};FM.unshift(f);op(f.id,'edit')}
function dup(id){const f=FM.find(x=>x.id==id),n=JSON.parse(JSON.stringify(f));n.id=uid();n.slug='salinan-'+uid();n.title+=' (Salinan)';n.active=false;n.resp=[];FM.unshift(n);go('list');toast('Form diduplikasi (nonaktif)')}
function del(id){const f=FM.find(x=>x.id==id);if(!confirm('Hapus form "'+f.title+'" beserta '+f.resp.length+' respons?'))return;FM=FM.filter(x=>x.id!=id);if(cur==id)cur=null;go('list')}
function tg(id){const f=FM.find(x=>x.id==id);f.active=!f.active;go(view);toast(f.active?'Form diaktifkan — tautan dapat diisi':'Form dinonaktifkan — tautan ditutup')}
function cp(id){const f=FM.find(x=>x.id==id),u=BASE+f.slug;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Tautan disalin'),()=>toast(u))}
function rg(){F().slug=F().title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,24)+'-'+uid();go('ed');toast('Tautan baru dibuat')}
function rd(i){F().resp.splice(i,1);go('ed')}
function clr(){if(confirm('Hapus semua respons?')){F().resp=[];go('ed')}}
function pubOpen(){const f=F()||FM[0],ok=isOpen(f);const why=!f.active?'Form ini sedang tidak menerima respons.':'Form ini sudah ditutup (batas respons atau tanggal tutup tercapai).';
$('#pub').innerHTML=`<div class="ob"><span>Simulasi halaman publik · ${BASE+f.slug}</span><button onclick="$('#pub').classList.remove('on');go(view)">Tutup</button></div><div class="pvw" style="flex:1">${ok?rform(f,'pb'):`<div class="fm"><h2>${esc(f.title)}</h2><p>${why}</p></div>`}</div>`;$('#pub').classList.add('on')}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
$('#mb').onclick=()=>$('#side').classList.toggle('show');
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=getComputedStyle(r).getPropertyValue('--bg').trim()==='#1b1d21'?'light':'dark'};
go('list');
</script>
</body>
</html>
